<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Checkout Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow">
        
        <div id="schoolHeader" class="mb-4 pb-4 border-b border-gray-200 flex flex-col items-center text-center justify-center">
            <div class="animate-pulse flex flex-col items-center space-y-2 py-1">
                <div class="rounded-full bg-gray-200 h-14 w-14"></div>
                <div class="h-2 bg-gray-200 rounded w-24"></div>
                <div class="h-4 bg-gray-200 rounded w-48"></div>
            </div>
        </div>
        
        <div id="authContainer" class="max-w-xl mx-auto my-4 p-6 border border-gray-200 rounded-lg bg-gray-50">
            <h2 class="text-lg font-semibold mb-2 text-gray-700 text-center">🔒 Authorization Required</h2>
            <p class="text-sm text-gray-500 mb-4 text-center">Please enter the administrative password to view active student logs.</p>
            <div class="mb-4">
                <input type="password" id="schoolPassword" placeholder="Enter password..." 
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button onclick="fetchLogs()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded transition">
                View Logs
            </button>
            <div id="errorMessage" class="text-red-600 text-sm mt-3 font-medium text-center hidden"></div>
        </div>

        <div id="logContent" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                    <span class="text-sm bg-green-100 text-green-800 font-medium px-2.5 py-0.5 rounded-full">Authorized Session</span>
                    <span id="lastUpdated" class="text-xs text-gray-500 italic"></span>
                </div>
                <button onclick="location.reload()" class="text-sm text-gray-500 hover:text-gray-700 underline">Lock Logs</button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-200">
                    <thead>
                        <tr class="bg-gray-800 text-white text-left text-sm uppercase font-semibold whitespace-nowrap">
                            <th class="py-3 px-4">Time</th>
                            <th class="py-3 px-4">Name</th>
                            <th class="py-3 px-4">Grade</th>
                            <th class="py-3 px-4">Initial Location</th>
                            <th class="py-3 px-4">Destination</th>
                            <th class="py-3 px-4">Period</th>
                            <th class="py-3 px-4">Day # Check-Out</th>
                            <th class="py-3 px-4">Return Time</th>
                            <th class="py-3 px-4">Duration</th>
                        </tr>
                    </thead>
                    <tbody id="logData" class="text-gray-700 text-sm divide-y divide-gray-200">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const scriptId = urlParams.get('scriptId');
        const SCRIPT_URL = scriptId 
            ? `https://script.google.com/macros/s/${scriptId}/exec`
            : "https://script.google.com/macros/s/AKfycbxVclYy7zB1W8D5NqyaAJjAJT7XiAWMkf4e1NJ-rBAoSbFotW6SZkxSYcDgvaHOxT6YGQ/exec";

        // 1. RUNS IMMEDIATELY ON PAGE LOAD: Displays JUST the school name (Centered)
        async function loadBranding() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getLogs&brandingOnly=true`);
                const data = await response.json();
                if (data.success) {
                    document.title = `${data.schoolName} - Portal`;
                    document.getElementById('schoolHeader').innerHTML = `
                        <div class="flex flex-col items-center text-center gap-2">
                            ${data.logo ? `<img src="${data.logo}" alt="School Logo" class="w-16 h-16 object-contain rounded">` : ''}
                            <h1 class="text-2xl font-bold text-gray-800">
                                ${data.schoolName}
                            </h1>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Failed to load school branding metadata.", err);
            }
        }

        // 2. RUNS WHEN USER CLICKS "VIEW LOGS": Adds concatenated language and re-aligns to left
        async function fetchLogs() {
            const passwordInput = document.getElementById('schoolPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.add('hidden');

            if (!passwordInput) {
                errorDiv.innerText = "Password cannot be blank.";
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${SCRIPT_URL}?action=getLogs&password=${encodeURIComponent(passwordInput)}`);
                const data = await response.json();

                if (data.success) {
                    // DYNAMIC REALIGNMENT TO THE LEFT WITH UPDATED TEXT
                    const headerContainer = document.getElementById('schoolHeader');
                    headerContainer.className = "mb-4 pb-4 border-b border-gray-200 flex flex-row items-center justify-start text-left";
                    
                    headerContainer.innerHTML = `
                        <div class="flex items-center gap-4">
                            ${data.logo ? `<img src="${data.logo}" alt="School Logo" class="w-14 h-14 object-contain rounded">` : ''}
                            <h1 class="text-xl font-bold text-gray-800">
                                ${data.schoolName} : Today's Student Movement
                            </h1>
                        </div>
                    `;

                    // Update timestamp label
                    const now = new Date();
                    const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    const dateString = now.toLocaleDateString();
                    document.getElementById('lastUpdated').innerText = `Last updated: ${dateString} at ${timeString}`;

                    const tbody = document.getElementById('logData');
                    tbody.innerHTML = ''; 

                    const todayStr = now.toDateString();

                    // FILTER DATA: Today's records where Direction is "Leaving"
                    let filteredLogs = data.logs.filter(log => {
                        if (!log.Timestamp) return false;
                        
                        const logDate = new Date(log.Timestamp);
                        const isToday = logDate.toDateString() === todayStr;
                        const isLeaving = String(log.Direction).trim().toLowerCase() === "leaving";

                        return isToday && isLeaving;
                    });

                    // SORT DATA: Descending order (Most recent timestamps at the top)
                    filteredLogs.sort((a, b) => new Date(b.Timestamp) - new Date(a.Timestamp));

                    // RENDER THE FILTERED COLUMNS
                    filteredLogs.forEach(log => {
                        const checkOutDate = new Date(log.Timestamp);
                        const formattedTime = checkOutDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                        let totalMinutes = 0;
                        let isReturned = false;
                        let displayReturnTime = "Empty";

                        if (log["Return Time"] && String(log["Return Time"]).trim() !== "") {
                            isReturned = true;
                            const returnDate = new Date(log["Return Time"]);
                            
                            if (!isNaN(returnDate)) {
                                displayReturnTime = returnDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                const diffMs = returnDate - checkOutDate;
                                totalMinutes = Math.round(diffMs / 60000);
                            } else {
                                displayReturnTime = log["Return Time"];
                                if (log.Duration && !isNaN(log.Duration)) {
                                    totalMinutes = Math.round(Number(log.Duration) / 60);
                                }
                            }
                        } else {
                            const diffMs = now - checkOutDate;
                            totalMinutes = Math.round(diffMs / 60000);
                        }

                        if (totalMinutes < 0) totalMinutes = 0;

                        // Color Selection Rule (Red if over 5 minutes)
                        const durationColorClass = totalMinutes > 10 ? "text-red-600 font-bold" : "text-blue-600 font-semibold";

                        const row = document.createElement('tr');
                        row.className = "hover:bg-gray-50 whitespace-nowrap";
                        row.innerHTML = `
                            <td class="py-3 px-4 font-mono text-gray-600">${formattedTime}</td>
                            <td class="py-3 px-4 font-medium text-gray-900">${log.Name || 'N/A'}</td>
                            <td class="py-3 px-4">${log.Grade || 'N/A'}</td>
                            <td class="py-3 px-4">${log["Initial Location"] || 'N/A'}</td>
                            <td class="py-3 px-4">${log.Destination || 'N/A'}</td>
                            <td class="py-3 px-4">${log.Period || 'N/A'}</td>
                            <td class="py-3 px-4">${log["Day# Check-Out"] || 'N/A'}</td>
                            <td class="py-3 px-4 ${isReturned ? 'text-gray-700' : 'text-gray-400 italic'}">${displayReturnTime}</td>
                            <td class="py-3 px-4 ${durationColorClass}">${totalMinutes} min</td>
                        `;
                        tbody.appendChild(row);
                    });

                    if (filteredLogs.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="9" class="py-8 text-center text-gray-400 bg-gray-50 italic">No checkout records found for today.</td></tr>`;
                    }

                    document.getElementById('authContainer').classList.add('hidden');
                    document.getElementById('logContent').classList.remove('hidden');
                } else {
                    errorDiv.innerText = data.error;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = "Failed to communicate with authorization server.";
                errorDiv.classList.remove('hidden');
                console.error(err);
            }
        }

        // Initialize and setup the 30-second live polling loop
        window.onload = () => {
            loadBranding();
            setInterval(() => {
                const logContent = document.getElementById('logContent');
                const passwordInput = document.getElementById('schoolPassword').value;
                if (logContent && !logContent.classList.contains('hidden') && passwordInput) {
                    fetchLogs();
                }
            }, 30000);
        };
    </script>
</body>
</html>
