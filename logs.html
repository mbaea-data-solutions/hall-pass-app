<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall Pass - Protected Checkout Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Camanche High - Student Checkout Log</h1>
        
        <div id="authContainer" class="max-w-md mx-auto my-12 p-6 border border-gray-200 rounded-lg bg-gray-50">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">🔒 Authorization Required</h2>
            <p class="text-sm text-gray-500 mb-4">Please enter the school-specific administrative password to view active student logs.</p>
            <div class="mb-4">
                <input type="password" id="schoolPassword" placeholder="Enter password..." 
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button onclick="fetchLogs()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded transition">
                View Logs
            </button>
            <div id="errorMessage" class="text-red-600 text-sm mt-3 font-medium hidden"></div>
        </div>

        <div id="logContent" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <span class="text-sm bg-green-100 text-green-800 font-medium px-2.5 py-0.5 rounded-full">Authorized Session</span>
                <button onclick="location.reload()" class="text-sm text-gray-500 hover:text-gray-700 underline">Lock Logs</button>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-200">
                    <thead>
                        <tr class="bg-gray-800 text-white text-left text-sm uppercase font-semibold">
                            <th class="py-3 px-4">Timestamp</th>
                            <th class="py-3 px-4">Student Name</th>
                            <th class="py-3 px-4">Destination</th>
                            <th class="py-3 px-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="logData" class="text-gray-700 text-sm divide-y divide-gray-200">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Replace with your exact Google Apps Script Executable URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxVclYy7zB1W8D5NqyaAJjAJT7XiAWMkf4e1NJ-rBAoSbFotW6SZkxSYcDgvaHOxT6YGQ/exec";

        async function fetchLogs() {
            const passwordInput = document.getElementById('schoolPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            
            errorDiv.classList.add('hidden');

            if (!passwordInput) {
                errorDiv.innerText = "Password cannot be blank.";
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                // Securely pass the inputted password directly to the query parameters
                const response = await fetch(`${SCRIPT_URL}?action=getLogs&password=${encodeURIComponent(passwordInput)}`);
                const data = await response.json();

                if (data.success) {
                    const tbody = document.getElementById('logData');
                    tbody.innerHTML = ''; // Reset UI

                    data.logs.forEach(log => {
                        const row = document.createElement('tr');
                        row.className = "hover:bg-gray-50";
                        row.innerHTML = `
                            <td class="py-3 px-4">${log.Timestamp || 'N/A'}</td>
                            <td class="py-3 px-4 font-medium">${log.Name || log.Student || 'N/A'}</td>
                            <td class="py-3 px-4">${log.Destination || 'N/A'}</td>
                            <td class="py-3 px-4">
                                <span class="px-2 py-1 rounded text-xs ${log.Status === 'Active' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}">
                                    ${log.Status || 'Completed'}
                                </span>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });

                    // Hide login container, show logs table
                    document.getElementById('authContainer').classList.add('hidden');
                    document.getElementById('logContent').classList.remove('hidden');
                } else {
                    // Show error returned directly from Google Apps Script
                    errorDiv.innerText = data.error;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = "Failed to communicate with authorization server.";
                errorDiv.classList.remove('hidden');
                console.error(err);
            }
        }
    </script>
</body>
</html>
