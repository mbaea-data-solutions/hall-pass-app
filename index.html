<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hall Pass QR Scanner</title>
  
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap4.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding-top: 40px; margin: 0; }
    .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
    .logo-container { text-align: center; margin-bottom: 15px; }
    .logo-container img { max-width: 200px; height: auto; }
    
    h2 { 
      color: #1c4566; 
      font-weight: 700; 
      text-align: center; 
      margin-bottom: 25px; 
      font-size: 1.5rem; 
    }
    #video { width: 100%; border-radius: 12px; background: #2c3e50; margin-bottom: 20px; display: none; transform: scaleX(-1); }
    
    /* Message Banner Styles */
    #messageBanner { padding: 12px; border-radius: 10px; margin-bottom: 15px; font-weight: 500; text-align: center; display: none; }
    .msg-error { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    .msg-success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; font-size: 1.1rem; padding: 15px; }
    .msg-info { background-color: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; font-size: 1.1rem; padding: 15px; }

    .student-info { background: #e8f0fe; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; color: #1967d2; text-align: center; }
    
    .btn-main { background-color: #1a4567; color: white; padding: 14px; border-radius: 10px; font-weight: bold; width: 100%; border: none; margin-top: 10px; transition: 0.3s; }
    .btn-main:hover { background-color: #afd14c; color: #e8f0fe }
    
    .hidden { display: none; }
    label { font-weight: 600; color: #555; margin-top: 10px; display: block; }
    .form-control { border-radius: 8px; margin-bottom: 15px; height: 45px; }

    .ts-wrapper.form-control { height: auto !important; min-height: 45px; border-radius: 8px; padding: 5px 12px; margin-bottom: 15px; }
    .ts-dropdown { border-radius: 8px; box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
       <img src="https://drive.google.com/thumbnail?authuser=0&sz=w500&id=1x4XZOsjxb-o13ZZCCt6OZcz5tzDMPZTy" alt="Agency Logo">
    </div>
    <h2>Digital Hall Pass</h2>
    
    <div id="messageBanner"></div>

    <div id="scannerSection">
      <video id="video" autoplay playsinline></video>
      
      <button id="startButton" class="btn-main">START SCAN</button>
      
      <div id="manualInputSection" class="hidden text-center mt-3">
        <label for="manualIdInput">Type Your Student ID Number:</label>
        <input type="text" id="manualIdInput" class="form-control text-center" placeholder="e.g. 12345" style="font-size: 1.2rem; letter-spacing: 2px;">
        <button id="manualSubmitBtn" class="btn-main" style="background-color: #1a4567; color: white;">LOOK UP ID</button>
      </div>

      <button id="noIdButton" class="btn btn-link btn-sm btn-block mt-3 text-muted" style="text-decoration: underline;">I don't have my ID with me</button>
    </div>

    <div id="questionSection" class="hidden">
      <div id="studentDisplay" class="student-info"></div>
      
      <label>Which classroom are you in?</label>
      <select id="classroomDrop" placeholder="Start typing to search classroom..."></select>

      <label>Are you entering or leaving?</label>
      <div class="mb-3 pl-1">
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="status" value="Entering" id="ent">
          <label class="form-check-label" for="ent">Entering</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="status" value="Leaving" id="lv">
          <label class="form-check-label" for="lv">Leaving</label>
        </div>
      </div>

      <div id="destinationSection" class="hidden">
        <label>Where are you going?</label>
        <select id="locationDrop" placeholder="Start typing to search destination..."></select>
      </div>

      <div id="submitActionArea" class="mt-4">
        <button id="submitBtn" class="btn-main" style="background-color: #34a853;">SUBMIT PASS</button>
      </div>
      
      <button id="cancelBtn" onclick="location.reload()" class="btn btn-link btn-sm btn-block mt-2 text-muted">Cancel / Start Over</button>
    </div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysJxfHVzSWpzI0JLowSuuDV-5Om1oj4_B0pPRfBF6O7HXPk94cdFtVTaf_usMZqDm_pg/exec"; 
  
  let currentStudent = null;
  const codeReader = new ZXing.BrowserMultiFormatReader();
  
  let classroomSearchControl;
  let locationSearchControl;

  function showMessage(text, type) {
    const banner = document.getElementById('messageBanner');
    banner.innerText = text;
    banner.className = ''; 
    banner.classList.add(type === 'error' ? 'msg-error' : type === 'success' ? 'msg-success' : 'msg-info');
    banner.style.display = 'block';
    if (type === 'success') {
       setTimeout(() => { location.reload(); }, 3000);
    }
  }

  // Helper function to render processing notifications inside the bottom action zone
  function showBottomStatus(text, type) {
    const actionArea = document.getElementById('submitActionArea');
    const alertClass = type === 'success' ? 'msg-success' : 'msg-info';
    actionArea.innerHTML = `<div class="${alertClass}">${text}</div>`;
  }

  window.onload = () => {
    fetch(`${SCRIPT_URL}?action=getInitialData`)
      .then(r => r.json())
      .then(data => {
        const classDrop = document.getElementById('classroomDrop');
        classDrop.add(new Option("", "", true, true)); 
        data.classrooms.forEach(c => classDrop.add(new Option(c, c)));
        
        const locDrop = document.getElementById('locationDrop');
        locDrop.add(new Option("", "", true, true)); 
        data.locations.forEach(l => locDrop.add(new Option(l, l)));

        classroomSearchControl = new TomSelect('#classroomDrop', { create: false, sortField: { field: "text", direction: "asc" } });
        locationSearchControl = new TomSelect('#locationDrop', { create: false, sortField: { field: "text", direction: "asc" } });
      });
  };

  // --- 3. SCANNER LOGIC ---
  document.getElementById('startButton').onclick = (e) => {
    document.getElementById('video').style.display = 'block';
    e.target.style.display = 'none'; 
    document.getElementById('noIdButton').style.display = 'none';
    document.getElementById('messageBanner').style.display = 'none';

    codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
      if (result) {
        codeReader.reset();
        document.getElementById('video').style.display = 'none';
        checkStudent(result.text);
      }
    });
  };

  // --- 3b. MANUAL ID ENTRY LOGIC ---
  document.getElementById('noIdButton').onclick = (e) => {
    document.getElementById('video').style.display = 'none';
    document.getElementById('startButton').style.display = 'none';
    codeReader.reset(); 
    
    document.getElementById('manualInputSection').classList.remove('hidden');
    e.target.style.display = 'none';
    document.getElementById('manualIdInput').focus();
  };

  document.getElementById('manualSubmitBtn').onclick = () => {
    const enteredId = document.getElementById('manualIdInput').value.trim();
    if (!enteredId) {
      showMessage("Please enter an ID number", "error");
      return;
    }
    checkStudent(enteredId);
  };

  function checkStudent(id) {
    showMessage("Checking ID...", "info");
    fetch(`${SCRIPT_URL}?action=findStudent&data="${id}"`)
      .then(r => r.json())
      .then(student => {
        if (!student) {
          showMessage("No student record found with this ID", "error");
          document.getElementById('startButton').style.display = 'block';
          document.getElementById('noIdButton').style.display = 'block';
          document.getElementById('manualInputSection').classList.add('hidden');
          document.getElementById('manualIdInput').value = '';
          return;
        }
        document.getElementById('messageBanner').style.display = 'none';
        currentStudent = student;
        document.getElementById('studentDisplay').innerText = `${student.name} (Grade ${student.grade})`;
        document.getElementById('scannerSection').classList.add('hidden');
        document.getElementById('questionSection').classList.remove('hidden');
      });
  }

  document.getElementsByName('status').forEach(el => {
    el.onchange = (e) => {
      const destSection = document.getElementById('destinationSection');
      if (e.target.value === 'Leaving') {
        destSection.classList.remove('hidden');
      } else {
        destSection.classList.add('hidden');
        if (locationSearchControl) locationSearchControl.setValue(""); 
      }
    };
  });

  // --- 5. SUBMIT TO GOOGLE SHEET ---
  document.getElementById('submitBtn').onclick = () => {
    const status = document.querySelector('input[name="status"]:checked')?.value;
    const classroom = document.getElementById('classroomDrop').value;
    const destination = document.getElementById('locationDrop').value;
    
    if (!classroom) return showMessage("Please select your classroom", "error");
    if (!status) return showMessage("Please select Entering or Leaving", "error");
    if (status === 'Leaving' && !destination) return showMessage("Please select a destination", "error");

    // NEW: Hide the cancel option and replace the submit button right away
    document.getElementById('cancelBtn').style.display = 'none';
    showBottomStatus("Saving pass... Please wait.", "info");

    const payload = {
      ...currentStudent,
      classroom: classroom,
      status: status,
      destination: status === 'Leaving' ? destination : "Entering Classroom"
    };

    fetch(`${SCRIPT_URL}?action=submitLog&data=${encodeURIComponent(JSON.stringify(payload))}`)
      .then(r => r.json())
      .then(res => {
        if (res.success) {
          // NEW: Swaps to a large green success box at the bottom, then reloads after 3 seconds
          showBottomStatus("Pass successfully recorded!", "success");
          setTimeout(() => { location.reload(); }, 3000);
        }
      })
      .catch(err => {
        // If it fails, restore the layout so they can retry
        document.getElementById('submitActionArea').innerHTML = `<button id="submitBtn" class="btn-main" style="background-color: #34a853;">SUBMIT PASS</button>`;
        document.getElementById('cancelBtn').style.display = 'block';
        // Wire the click handler back up since the HTML was replaced
        document.getElementById('submitBtn').onclick = arguments.callee;
        showMessage("Error saving: " + err, "error");
      });
  };
</script>
</body>
</html>
