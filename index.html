<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hall Pass QR Scanner</title>
  
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding-top: 15px; margin: 0; }
    .card { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    .logo-container { text-align: center; margin-bottom: 8px; }
    .logo-container img { max-width: 140px; height: auto; }
    h2 { color: #1c4566; font-weight: 700; text-align: center; margin-bottom: 12px; font-size: 1.35rem; }
    #video { width: 100%; border-radius: 12px; background: #2c3e50; margin-bottom: 12px; display: none; transform: scaleX(-1); }
    #messageBanner { padding: 8px; border-radius: 8px; margin-bottom: 10px; font-weight: 500; text-align: center; display: none; font-size: 0.9rem; }
    .msg-error { background-color: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    .msg-success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; font-size: 1rem; padding: 10px; }
    .msg-info { background-color: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; font-size: 1rem; padding: 10px; }
    .student-info { background: #e8f0fe; padding: 10px; border-radius: 8px; margin-bottom: 12px; font-weight: bold; color: #1967d2; text-align: center; font-size: 0.95rem; }
    .btn-main { background-color: #1a4567; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; width: 85%; display: block; margin: 8px auto 0 auto; border: none; transition: 0.3s; font-size: 0.95rem; }
    .btn-main:hover { background-color: #afd14c; color: #000000; }
    .hidden { display: none; }
    label { font-weight: 600; color: #555; margin-top: 6px; margin-bottom: 4px; display: block; font-size: 0.9rem; }
    .form-control { border-radius: 8px; margin-bottom: 10px; height: 38px; font-size: 0.9rem; }
    .form-check { margin-bottom: 4px !important; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <img id="schoolLogo" src="" alt="School Logo" style="display: none;">
    </div>
    <h2 id="appTitle">Loading Hall Pass...</h2>
    
    <div id="messageBanner"></div>

    <div id="gatekeeperSection" class="text-center py-3 hidden">
      <p class="text-muted small">Staff Verification Required</p>
      <input type="password" id="gatekeeperPin" class="form-control text-center mx-auto" placeholder="Enter Access Code" style="max-width: 85%;">
      
      <label for="staffDefaultClassroom" class="mt-2 text-muted small" style="font-weight: normal;">Set Device Default Classroom (Optional):</label>
      <select id="staffDefaultClassroom" class="form-control mx-auto" style="max-width: 85%;"></select>
      
      <div id="loginErrorMsg" class="text-danger small font-weight-bold my-2" style="display: none;">❌ Invalid Access Code. Try again.</div>
      <button id="verifyBtn" class="btn-main">VERIFY & ENTER</button>
    </div>

    <div id="appProtectedContent" class="hidden">
      <div id="scannerSection">
        <video id="video" autoplay playsinline></video>
        <button id="startButton" class="btn-main">START SCAN</button>
        
        <div id="manualInputSection" class="hidden text-center mt-2">
          <label for="manualIdInput">Type Your Student ID Number:</label>
          <input type="text" id="manualIdInput" class="form-control text-center mx-auto" placeholder="e.g. 12345" style="font-size: 1.1rem; letter-spacing: 2px; max-width: 85%;">
          <button id="manualSubmitBtn" class="btn-main" style="background-color: #1a4567; color: white;">LOOK UP ID</button>
        </div>
        <button id="noIdButton" class="btn btn-link btn-sm btn-block mt-2 text-muted" style="text-decoration: underline; font-size: 0.85rem;">I don't have my ID with me</button>
      </div>

      <div id="questionSection" class="hidden">
        <div id="studentDisplay" class="student-info"></div>
        <label for="classroomDrop">Which classroom are you in?</label>
        <select id="classroomDrop" class="form-control mx-auto" style="max-width: 85%;"></select>

        <label>Are you entering or leaving?</label>
        <div class="mb-2 pl-5" style="font-size: 0.95rem; text-align: left; max-width: 85%; margin: 0 auto;">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="status" value="Entering" id="ent">
            <label class="form-check-label" for="ent" style="display:inline; margin:0; font-weight:normal;">Entering</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="status" value="Leaving" id="lv">
            <label class="form-check-label" for="lv" style="display:inline; margin:0; font-weight:normal;">Leaving</label>
          </div>
        </div>

        <div id="destinationSection" class="hidden">
          <label for="locationDrop">Where are you going?</label>
          <select id="locationDrop" class="form-control mx-auto" style="max-width: 85%;"></select>
        </div>

        <div id="submitActionArea" class="mt-2"></div>
        <div id="debugConsole" class="text-left small text-muted p-2 mt-2 hidden" style="background: #222; color: #00ff00 !important; font-family: monospace; border-radius: 6px; max-height: 120px; overflow-y: auto; width: 85%; margin: 10px auto;"></div>
        <button id="cancelBtn" onclick="resetAppForm()" class="btn btn-link btn-sm btn-block mt-1 text-muted" style="font-size: 0.85rem;">Cancel / Start Over</button>
      </div>
    </div>
  </div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const SCRIPT_URL = urlParams.get('scriptUrl');

  const MASTER_PASSWORD = "mbaea"; 
  let SECRETHASH = ""; 

  const LOCK_TIMEOUT_MS = 10 * 60 * 60 * 1000; // 10 hours
  let currentStudent = null;
  const codeReader = new ZXing.BrowserMultiFormatReader();

  async function hashString(str) {
    const utf8 = new TextEncoder().encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  window.addEventListener('DOMContentLoaded', async () => {
    sessionStorage.removeItem('hallPassLoginTime'); 
    SECRETHASH = await hashString(MASTER_PASSWORD.trim());

    if (SCRIPT_URL) {
      initializeApp();
    } else {
      alert("Configuration Error: Missing 'scriptUrl' parameter in your browser link!");
    }
  });

  document.getElementById('verifyBtn').onclick = async () => {
    const input = document.getElementById('gatekeeperPin').value.trim();
    if (!input) return;

    const errorDiv = document.getElementById('loginErrorMsg');
    const inputHash = await hashString(input);
    const expectedHash = await hashString(MASTER_PASSWORD.trim());

    if (inputHash === expectedHash) {
      errorDiv.style.display = 'none';
      sessionStorage.setItem('hallPassLoginTime', Date.now().toString());
      
      // --- CHANGED/ADDED: Save default room preference to local device storage ---
      const selectedDefault = document.getElementById('staffDefaultClassroom').value;
      if (selectedDefault) {
        localStorage.setItem('defaultClassroom', selectedDefault);
      } else {
        localStorage.removeItem('defaultClassroom'); // Clears it if they left it blank
      }
      
      showAppDirectly();
    } else {
      errorDiv.style.display = 'block';
      document.getElementById('gatekeeperPin').value = '';
      document.getElementById('gatekeeperPin').focus();
    }
  };

  document.getElementById('gatekeeperPin').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('verifyBtn').click();
  });

  function showAppDirectly() {
    document.getElementById('gatekeeperSection').classList.add('hidden');
    document.getElementById('appProtectedContent').classList.remove('hidden');
    resetAppForm();
  }

  function isSessionExpired() {
    const loginTime = sessionStorage.getItem('hallPassLoginTime');
    if (!loginTime) return false; 
    
    if (Date.now() - parseInt(loginTime) >= LOCK_TIMEOUT_MS) {
      sessionStorage.removeItem('hallPassLoginTime');
      return true;
    }
    return false;
  }

  function showMessage(text, type) {
    const banner = document.getElementById('messageBanner');
    banner.innerText = text; 
    banner.className = ''; 
    banner.classList.add(type === 'error' ? 'msg-error' : type === 'success' ? 'msg-success' : 'msg-info');
    banner.style.display = 'block';
  }

  // CHANGED: Dynamically switches background style based on the type ('error', 'success', or 'info')
  function showBottomStatus(text, type) {
    const dbg = document.getElementById('debugConsole');
    
    let className = 'msg-info'; // Default blue
    if (type === 'error') className = 'msg-error';   // Red
    if (type === 'success') className = 'msg-success'; // Green

    if (type === 'success') {
      // Clear the button only on total success
      document.getElementById('submitActionArea').innerHTML = `<div class="${className}" style="width: 85%; margin: 0 auto;">${text}</div>`;
      dbg.classList.add('hidden');
    } else {
      // For errors or loading states, show the message below the button
      dbg.className = `text-center p-2 mt-2 ${className}`;
      dbg.style.width = "85%";
      dbg.style.margin = "10px auto";
      dbg.style.borderRadius = "8px";
      dbg.style.fontWeight = "500";
      dbg.innerText = text;
      dbg.classList.remove('hidden');
    }
  }
  
  function resetAppForm() {
    currentStudent = null;
    codeReader.reset();
    
    document.getElementById('messageBanner').style.display = 'none';
    document.getElementById('video').style.display = 'none';
    document.getElementById('manualInputSection').classList.add('hidden');
    document.getElementById('destinationSection').classList.add('hidden');
    document.getElementById('questionSection').classList.add('hidden');
    document.getElementById('scannerSection').classList.remove('hidden');
    
    document.getElementById('startButton').style.display = 'block';
    document.getElementById('noIdButton').style.display = 'block';
    document.getElementById('cancelBtn').style.display = 'block';
    document.getElementById('manualIdInput').value = '';
    
    document.getElementById('classroomDrop').value = "";
    document.getElementById('locationDrop').value = "";
    
    // --- CHANGED TO THIS: Automatically apply default room if it exists ---
    const defaultRoom = localStorage.getItem('defaultClassroom');
    if (defaultRoom) {
      document.getElementById('classroomDrop').value = defaultRoom;
    } else {
      document.getElementById('classroomDrop').value = "";
    }
    document.getElementById('locationDrop').value = "";
    
    document.querySelectorAll('input[name="status"]').forEach(input => {
    input.addEventListener('change', (e) => {
      const destSec = document.getElementById('destinationSection');
      if (e.target.value === 'Leaving') {
        destSec.classList.remove('hidden');
      } else {
        // --- CHANGED/ADDED: Clear the dropdown value when switching to "Entering" ---
        document.getElementById('locationDrop').value = ""; 
        destSec.classList.add('hidden');
      }
    });
  });
    
    document.getElementById('submitActionArea').innerHTML = `<button id="submitBtn" class="btn-main" style="background-color: #34a853;">SUBMIT PASS</button>`;
    document.getElementById('submitBtn').onclick = handlePassSubmission;

    document.getElementById('startButton').onclick = () => {
      document.getElementById('startButton').style.display = 'none';
      document.getElementById('noIdButton').style.display = 'none';
      document.getElementById('video').style.display = 'block';
      
      codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
        if (result) {
          console.log("QR Code Scanned: ", result.text);
          codeReader.reset();
          checkStudent(result.text.trim());
        }
        if (err && !(err instanceof ZXing.NotFoundException)) {
          console.error("Camera Error: ", err);
        }
      });
    };

    document.getElementById('noIdButton').onclick = () => {
      document.getElementById('startButton').style.display = 'none';
      document.getElementById('noIdButton').style.display = 'none';
      document.getElementById('video').style.display = 'none';
      document.getElementById('manualInputSection').classList.remove('hidden');
      document.getElementById('manualIdInput').focus();
    };
  }

  document.getElementById('manualSubmitBtn').onclick = () => {
    const manualVal = document.getElementById('manualIdInput').value.trim();
    if (manualVal) {
      checkStudent(manualVal);
    }
  };

  document.querySelectorAll('input[name="status"]').forEach(input => {
    input.addEventListener('change', (e) => {
      const destSec = document.getElementById('destinationSection');
      if (e.target.value === 'Leaving') {
        destSec.classList.remove('hidden');
      } else {
        destSec.classList.add('hidden');
      }
    });
  });

  function initializeApp() {
    const initUrl = `${SCRIPT_URL}?action=${encodeURIComponent('getInitialData')}`;
    
    fetch(initUrl)
      .then(r => r.json())
      .then(data => {
        if (data && data.schoolName) {
          document.getElementById('appTitle').innerText = `${data.schoolName} Hall Pass`;
        }

        if (data) {
          const logoImg = document.getElementById('schoolLogo');
          
          // Pull your official logo ID if available, otherwise default to a blank placeholder to trip the onerror handler
          const primaryId = data.logoId || "INVALID_ID_TRIGGER"; 
          
          // 1. Try to load the primary source configuration first
          logoImg.src = data.logoUrl || `https://drive.google.com/thumbnail?authuser=0&sz=w500&id=${primaryId}`; 
          logoImg.alt = `${data.schoolName || 'School'} Logo`;
          
          // 2. IMMEDIATE FALLBACK GATE: If the primary link fails, instantly swap to your secure backup link
          logoImg.onerror = function() {
            console.warn("Primary logo blocked or missing. Switching to fallback instantly.");
            this.src = "https://drive.google.com/thumbnail?authuser=0&sz=w500&id=1DX6wlC6KLTFA0r6BjuncDnyYu_aCefhV";
            this.onerror = null; // Prevents infinite loops if the fallback link fails
          };

          logoImg.style.display = 'inline-block'; 
        }

        const classDrop = document.getElementById('classroomDrop');
        classDrop.innerHTML = ""; 
        classDrop.add(new Option("Select a classroom...", "", true, true)); 
        if (data.classrooms) data.classrooms.forEach(c => classDrop.add(new Option(c, c)));
        
        // --- CHANGED/ADDED: Populate the staff login screen room selector too ---
        const staffDrop = document.getElementById('staffDefaultClassroom');
        staffDrop.innerHTML = "";
        staffDrop.add(new Option("None - Ask student every time", "", true, true));
        if (data.classrooms) data.classrooms.forEach(c => staffDrop.add(new Option(c, c)));
        
        // If they already have a saved room from a previous session, pre-select it on the lock screen
        const savedRoom = localStorage.getItem('defaultClassroom');
        if (savedRoom) staffDrop.value = savedRoom;
        
        const locDrop = document.getElementById('locationDrop');
        locDrop.innerHTML = ""; 
        locDrop.add(new Option("Select a destination...", "", true, true)); 
        if (data.locations) data.locations.forEach(l => locDrop.add(new Option(l, l)));
        
        resetAppForm(); 
        document.getElementById('gatekeeperSection').classList.remove('hidden');
      })
      .catch(err => {
        console.error("Initialization failed: ", err);
        showMessage("Failed to connect to school database.", "error");
      });
  }

  function checkStudent(id) {
    showMessage("Checking ID...", "info");
    const studentUrl = `${SCRIPT_URL}?action=${encodeURIComponent('findStudent')}&data=${encodeURIComponent(JSON.stringify(id))}`;
    
    fetch(studentUrl)
      .then(r => r.json())
      .then(student => {
        if (!student) {
          showMessage("No student record found", "error");
          document.getElementById('video').style.display = 'none';
          document.getElementById('startButton').style.display = 'block';
          document.getElementById('noIdButton').style.display = 'block';
          document.getElementById('manualInputSection').classList.add('hidden');
          return;
        }
        document.getElementById('messageBanner').style.display = 'none';
        currentStudent = student;
        document.getElementById('studentDisplay').innerText = `${student.name} (Grade ${student.grade})`;
        document.getElementById('scannerSection').classList.add('hidden');
        document.getElementById('manualInputSection').classList.add('hidden');
        document.getElementById('questionSection').classList.remove('hidden');
      });
  }

  function handlePassSubmission() {
    if (isSessionExpired()) {
      alert("Staff session expired. Please log in again.");
      sessionStorage.removeItem('hallPassLoginTime');
      location.reload();
      return;
    }
    
    const status = document.querySelector('input[name="status"]:checked')?.value;
    const classroom = document.getElementById('classroomDrop').value;
    const destination = document.getElementById('locationDrop').value;
    
    // --- CHANGED: Detailed In-UI Form Validation ---
    if (!classroom) {
      showBottomStatus("Select your current location", "error");
      return;
    }
    if (!status) {
      showBottomStatus("Select Entering or Leaving.", "error");
      return;
    }
    if (status === 'Leaving' && !destination) {
      showBottomStatus("Select a destination.", "error");
      return;
    }

    // --- CHANGED/ADDED: Identity Match Logic Gate ---
      if (classroom === destination) {
        showBottomStatus("⚠️ Your current location and your destination are the same. Please update your destination or switch to 'entering' if you are checking back in.", "error");
        return;
      }

    document.getElementById('cancelBtn').style.display = 'none';
    showBottomStatus("Saving pass...", "info");

    const payload = { ...currentStudent, classroom, status, destination: status === 'Leaving' ? destination : "Entering Classroom" };
    const submitUrl = `${SCRIPT_URL}?action=${encodeURIComponent('submitLog')}&data=${encodeURIComponent(JSON.stringify(payload))}`;

    fetch(submitUrl)
      .then(r => r.json())
      .then(res => {
        if (res.success) {
          showBottomStatus("Pass recorded!", "success");
          setTimeout(() => { resetAppForm(); }, 2500); 
        } else {
          // --- CHANGED: Simpler error handling because the button never vanishes ---
          showBottomStatus("⚠️ Error saving pass. Please try clicking submit again.", "error");
          document.getElementById('cancelBtn').style.display = 'block';
        }
      })
      .catch(err => {
        // Fallback catch if the internet cuts out entirely mid-click
        showBottomStatus("⚠️ Network error. Check connection and click submit again.", "error");
        document.getElementById('cancelBtn').style.display = 'block';
      });
  }
</script>
</body>
</html>
