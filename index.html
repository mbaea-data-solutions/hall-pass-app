<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    body { background: #f4f7f6; display: flex; justify-content: center; padding-top: 50px; }
    .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
    #video { width: 100%; border-radius: 10px; display: none; margin-bottom: 15px; }
    .hidden { display: none; }
    .student-info { background: #e8f0fe; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2 class="text-center">Hall Pass</h2>
  
  <div id="scannerSection">
    <video id="video" autoplay playsinline></video>
    <button id="startButton" class="btn btn-primary btn-block">START SCAN</button>
  </div>

  <div id="questionSection" class="hidden">
    <div id="studentDisplay" class="student-info"></div>
    
    <label>Which classroom are you in?</label>
    <select id="classroomDrop" class="form-control mb-3"></select>

    <label>Are you entering or leaving?</label>
    <div class="mb-3">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="status" value="Entering" id="ent">
        <label class="form-check-label" for="ent">Entering</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="status" value="Leaving" id="lv">
        <label class="form-check-label" for="lv">Leaving</label>
      </div>
    </div>

    <div id="destinationSection" class="hidden">
      <label>Where are you going?</label>
      <div id="locationOptions" class="mb-3"></div>
    </div>

    <button id="submitBtn" class="btn btn-success btn-block">SUBMIT</button>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbysJxfHVzSWpzI0JLowSuuDV-5Om1oj4_B0pPRfBF6O7HXPk94cdFtVTaf_usMZqDm_pg/exec"; // PASTE YOUR URL HERE
  let currentStudent = null;
  const codeReader = new ZXing.BrowserMultiFormatReader();

  // Load Lists on startup
  window.onload = () => {
    fetch(`${SCRIPT_URL}?action=getInitialData`)
      .then(r => r.json())
      .then(data => {
        const drop = document.getElementById('classroomDrop');
        data.classrooms.forEach(c => drop.add(new Option(c, c)));
        
        const locDiv = document.getElementById('locationOptions');
        data.locations.forEach(l => {
          locDiv.innerHTML += `<div class="form-check"><input class="form-check-input" type="radio" name="dest" value="${l}" id="${l}"><label class="form-check-label" for="${l}">${l}</label></div>`;
        });
      });
  };

  document.getElementById('startButton').onclick = () => {
    document.getElementById('video').style.display = 'block';
    codeReader.decodeFromVideoDevice(undefined, 'video', (result) => {
      if (result) {
        codeReader.reset();
        document.getElementById('video').style.display = 'none';
        checkStudent(result.text);
      }
    });
  };

  function checkStudent(id) {
    fetch(`${SCRIPT_URL}?action=findStudent&data="${id}"`)
      .then(r => r.json())
      .then(student => {
        if (!student) return alert("No student record found with this Id");
        currentStudent = student;
        document.getElementById('studentDisplay').innerText = `${student.name} (Grade ${student.grade})`;
        document.getElementById('scannerSection').classList.add('hidden');
        document.getElementById('questionSection').classList.remove('hidden');
      });
  }

  // Show/Hide Question 3
  document.getElementsByName('status').forEach(el => {
    el.onchange = (e) => {
      const dest = document.getElementById('destinationSection');
      e.target.value === 'Leaving' ? dest.classList.remove('hidden') : dest.classList.add('hidden');
    };
  });

  document.getElementById('submitBtn').onclick = () => {
    const status = document.querySelector('input[name="status"]:checked')?.value;
    const dest = document.querySelector('input[name="dest"]:checked')?.value;
    
    if (!status) return alert("Please select Entering or Leaving");

    const payload = {
      ...currentStudent,
      classroom: document.getElementById('classroomDrop').value,
      status: status,
      destination: status === 'Leaving' ? dest : "Entering Classroom"
    };

    fetch(`${SCRIPT_URL}?action=submitLog&data=${encodeURIComponent(JSON.stringify(payload))}`)
      .then(() => {
        alert("Pass Recorded!");
        location.reload();
      });
  };
</script>
</body>
</html>
