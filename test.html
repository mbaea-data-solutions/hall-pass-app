<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GATEWAY - Hall Pass</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <style>
    /* Styling to keep disabled inputs cleanly readable as flat text instead of vanished fields */
    .form-control:disabled, .select2-container--disabled .select2-selection--single {
      background-color: #f1f3f5 !important;
      border: 1px solid #ced4da !important;
      color: #212529 !important;
      opacity: 0.85;
      cursor: default;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f7f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15px;
      margin: 0;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      margin-bottom: 15px;
      transition: border 0.3s ease, background-color 0.3s ease;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 8px;
    }
    .logo-container img {
      max-width: 140px;
      height: auto;
    }
    h2 {
      color: #1c4566;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
      font-size: 1.35rem;
    }
    #video, #teacherVideo {
      width: 100%;
      border-radius: 12px;
      background: #2c3e50;
      margin-bottom: 12px;
      display: none;
      transform: scaleX(-1);
    }
    #messageBanner {
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: 500;
      text-align: center;
      display: none;
      font-size: 0.9rem;
    }
    .msg-error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }
    .msg-success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
      font-size: 1rem;
      padding: 10px;
    }
    .msg-info {
      background-color: #e3f2fd;
      color: #1565c0;
      border: 1px solid #90caf9;
      font-size: 1rem;
      padding: 10px;
    }
    .student-info {
      background: #e8f0fe;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: bold;
      color: #1967d2;
      text-align: center;
      font-size: 0.95rem;
    }
    .btn-main {
      background-color: #1a4567;
      color: white;
      padding: 6px 16px;
      border-radius: 8px;
      font-weight: bold;
      width: 60%;
      display: block;
      margin: 8px auto 0 auto;
      border: none;
      transition: 0.3s;
      font-size: 0.95rem;
    }
    .btn-main:hover {
      background-color: #afd14c;
      color: #000000;
    }
    .btn-main:disabled {
      background-color: #cccccc !important;
      color: #666666 !important;
      cursor: not-allowed;
    }
    .btn-staff {
  background-color: #5a6b7c;
  color: white;
  padding: 0 16px;            /* Reset vertical padding */
  border-radius: 8px;
  font-weight: bold;
  width: 60%;
  display: inline-flex;       /* Ensures text centers vertically inside */
  align-items: center;
  justify-content: center;
  margin: 0 !important;       /* Overrides any default/inline top margins */
  border: none;
  transition: 0.3s;
  font-size: 0.95rem;
  height: 38px;               /* Force identical fixed height */
  line-height: 38px;
}
    .btn-staff:hover {
  background-color: #afd14c !important;
  color: #000000 !important;
  text-decoration: none !important;
}
    .btn-staff:disabled {
      background-color: #cccccc !important;
      color: #666666 !important;
      cursor: not-allowed;
    }
    .hidden {
      display: none !important;
    }
    label {
      font-weight: 600;
      color: #555;
      margin-top: 6px;
      margin-bottom: 4px;
      display: block;
      font-size: 0.9rem;
    }
    .form-control {
      border-radius: 8px;
      margin-bottom: 10px;
      height: 38px;
      font-size: 0.9rem;
    }
    .form-check {
      margin-bottom: 4px !important;
    }
    .staff-login-header {
      color: #c62828;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }
    .warning-flash {
      border: 3px solid #ef4444 !important;
      background-color: #fef2f2 !important;
    }
    .clean-pass {
      border: 3px solid #10b981 !important;
      background-color: #ecfdf5 !important;
    }
    .badge-eval {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-warn {
      background: #fee2e2;
      color: #991b1b;
    }
    .badge-ok {
      background: #d1fae5;
      color: #065f46;
    }
    .conflict-box {
      background-color: #fef2f2;
      border: 2px solid #ef4444;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
    }
    .select2-container {
      margin: 0 auto 10px auto !important;
      display: block !important;
    }
  </style>
</head>
<body>
<body>

  <!-- =========================================================
       MAIN APPLICATION
       ========================================================= -->

  <div class="card" id="mainAppCard">

    <div class="logo-container">
      <img
        id="schoolLogo"
        src=""
        alt="School Logo"
        style="
          display:none;
          height:70px;
          width:auto;
          object-fit:contain;
          max-width:90%;
        "
      >
    </div>

    <h2 id="appTitle">
      Loading Hall Pass...
    </h2>

    <div id="messageBanner"></div>


    <!-- =======================================================
         OPTIONAL DEVICE LOGIN
         ======================================================= -->

    <div
      id="gatekeeperSection"
      class="text-center py-3 hidden"
    >

      <p class="staff-login-header">
        Staff Login Required
      </p>

      <label for="staffLocationDrop">
        Select Your Default Location:
      </label>

      <select
        id="staffLocationDrop"
        class="form-control mx-auto"
        style="width:85%;"
      ></select>

      <div
        id="staffLocationErrorMsg"
        class="text-danger small font-weight-bold my-2"
        style="display:none;"
      >
        ❌ Please select your location first.
      </div>

      <input
        type="password"
        id="gatekeeperPin"
        class="form-control text-center mx-auto"
        placeholder="Enter Access Code"
        style="max-width:85%;"
      >

      <div
        id="loginErrorMsg"
        class="text-danger small font-weight-bold my-2"
        style="display:none;"
      ></div>

      <button
        id="verifyBtn"
        class="btn-main"
      >
        VERIFY & ENTER
      </button>

    </div>


    <!-- =======================================================
         PROTECTED / STUDENT APPLICATION
         ======================================================= -->

    <div id="appProtectedContent" class="hidden">

      <!-- STUDENT SCANNER -->

      <div id="scannerSection">

        <video
          id="video"
          autoplay
          playsinline
        ></video>

        <div
          id="studentInputGroup"
          class="d-flex align-items-center justify-content-center mx-auto"
          style="
            max-width:60%;
            gap:12px;
            margin-top:8px;
          "
        >

          <button
            id="startButton"
            class="btn-main m-0"
            style="
              flex:1;
              width:auto;
              height:38px;
              padding:0;
            "
          >
            SCAN ID
          </button>

          <button
            id="noIdButton"
            class="btn-main m-0"
            style="
              flex:1;
              width:auto;
              height:38px;
              padding:0;
            "
          >
            TYPE ID
          </button>

        </div>


        <div
          id="manualInputSection"
          class="hidden text-center mt-2"
        >

          <label for="manualIdInput">
            Type Your Student ID Number:
          </label>

          <input
            type="text"
            id="manualIdInput"
            class="form-control text-center mx-auto"
            placeholder="e.g. 12345"
            style="
              font-size:1.1rem;
              letter-spacing:2px;
              max-width:85%;
            "
          >

          <button
            id="manualSubmitBtn"
            class="btn-main"
          >
            Look up ID
          </button>

        </div>

      </div>


      <!-- =====================================================
           STUDENT FORM
           ===================================================== -->

      <div
        id="questionSection"
        class="hidden"
      >

        <div
          id="studentDisplay"
          class="student-info"
        ></div>


        <div
          id="studentSelectionSummary"
          class="text-left mx-auto mb-3 hidden"
          style="
            max-width:85%;
            font-size:.95rem;
          "
        >

          <ul
            class="m-0 pl-3"
            style="
              color:#495057;
              font-weight:500;
            "
          >

            <li id="sumClassroom">
              Classroom: --
            </li>

            <li id="sumDestination">
              Destination: --
            </li>

          </ul>

        </div>


        <div id="studentFormFields">

          <label for="classroomDrop">
            Current Classroom
          </label>

          <select
            id="classroomDrop"
            class="form-control mx-auto"
            style="width:85%;"
          ></select>


          <label>
            Are you entering or leaving?
          </label>

          <div
            class="mb-3 text-left"
            style="
              max-width:85%;
              margin:0 auto;
              display:flex;
              gap:25px;
            "
          >

            <div
              class="form-check"
              style="margin:0;"
            >

              <input
                class="form-check-input"
                type="radio"
                name="status"
                value="Entering"
                id="ent"
              >

              <label
                class="form-check-label"
                for="ent"
                style="
                  display:inline;
                  margin:0;
                  font-weight:normal;
                "
              >
                Entering
              </label>

            </div>


            <div
              class="form-check"
              style="margin:0;"
            >

              <input
                class="form-check-input"
                type="radio"
                name="status"
                value="Leaving"
                id="lv"
              >

              <label
                class="form-check-label"
                for="lv"
                style="
                  display:inline;
                  margin:0;
                  font-weight:normal;
                "
              >
                Leaving
              </label>

            </div>

          </div>


          <div
            id="destinationSection"
            class="hidden"
          >

            <label for="locationDrop">
              Where are you going?
            </label>

            <select
              id="locationDrop"
              class="form-control mx-auto"
              style="width:85%;"
            ></select>

          </div>


          <div
            id="submitActionArea"
            class="mt-2"
          >

            <button
              id="submitBtn"
              class="btn-main"
              style="background-color:#34a853;"
            >
              SUBMIT
            </button>

          </div>

        </div>

      </div>


      <!-- =====================================================
           STAFF APPROVAL
           ===================================================== -->

      <div
        id="supervisorGateSection"
        class="hidden text-center p-2 mt-3"
        style="
          border-top:3px solid #1a4567;
          padding-top:20px!important;
        "
      >

        <h3
          class="text-uppercase font-weight-bold mb-3"
          style="
            color:#1a4567;
            font-size:.95rem;
            letter-spacing:1.5px;
          "
        >
          — Staff Approval —
        </h3>


        <div
          id="conflictContainer"
          class="conflict-box hidden text-left mx-auto mb-3"
          style="max-width:85%;"
        >

          <div id="evaluationBadgeArea"></div>

          <ul
            id="evalMessageList"
            class="pl-3 mb-0 text-danger font-weight-bold"
          ></ul>

        </div>


        <div
          class="mb-3 mx-auto"
          style="
            max-width:85%;
            display:flex;
            align-items:center;
            gap:20px;
          "
        >

          <label
            style="
              margin:0;
              font-weight:600;
            "
          >
            Decision:
          </label>

          <div class="form-check">

            <input
              class="form-check-input"
              type="radio"
              name="staffDecision"
              value="Approved"
              id="decApprove"
            >

            <label
              class="form-check-label"
              for="decApprove"
            >
              Approved
            </label>

          </div>

          <div class="form-check">

            <input
              class="form-check-input"
              type="radio"
              name="staffDecision"
              value="Denied"
              id="decDeny"
            >

            <label
              class="form-check-label"
              for="decDeny"
            >
              Denied
            </label>

          </div>

        </div>


        <div class="text-center">

          <video
            id="teacherVideo"
            autoplay
            playsinline
            style="
              width:100%;
              display:none;
              max-height:220px;
              object-fit:cover;
            "
          ></video>


          <div
            id="teacherInputGroup"
            class="d-flex justify-content-center"
            style="
              gap:12px;
              max-width:60%;
              margin:auto;
            "
          >

            <button
              id="startTeacherScannerBtn"
              class="btn-staff"
            >
              SCAN ID
            </button>

            <button
              id="noStaffIdLink"
              class="btn-staff"
            >
              TYPE ID
            </button>

          </div>


          <div
            id="manualStaffPinContainer"
            class="mt-3 hidden"
          >

            <label
              for="staffPinVerify"
            >
              Staff ID / PIN
            </label>

            <input
              type="password"
              id="staffPinVerify"
              class="form-control text-center font-weight-bold mx-auto"
              style="
                letter-spacing:.2em;
                max-width:60%;
              "
            >

          </div>

        </div>


        <div
          id="staffErrorMsg"
          class="text-danger small font-weight-bold my-2"
          style="display:none;"
        ></div>


        <button
          id="gateSubmitBtn"
          class="btn btn-success font-weight-bold px-4 py-2 mt-3 shadow-sm hidden"
        >
          SUBMIT
        </button>

      </div>


      <button
        id="cancelBtn"
        class="btn btn-link btn-sm btn-block mt-1 text-muted"
        style="font-size:.85rem;"
      >
        Cancel / Start Over
      </button>

    </div>

  </div>


  <!-- =========================================================
       ACTIVE PASS
       ========================================================= -->

  <div
    class="card hidden text-center"
    id="activePassCard"
  >

    <div class="logo-container my-2">

      <img
        id="activeSchoolLogo"
        src=""
        alt="School Logo"
        style="
          height:60px;
          max-width:90%;
          object-fit:contain;
        "
      >

    </div>


    <h2
      id="activePassTitle"
      class="font-weight-bold mb-1"
      style="font-size:1.35rem;"
    >
      ✨ ACTIVE HALL PASS ✨
    </h2>


    <hr id="activePassDivider">


    <div
      id="timerContainerBox"
      class="p-3 my-2 rounded shadow-sm mx-auto"
      style="max-width:90%;"
    >

      <div
        class="text-muted small text-uppercase font-weight-bold"
      >
        Time Out of Room
      </div>

      <div
        id="liveTimerDisplay"
        class="font-weight-bold text-dark my-1"
        style="
          font-size:3rem;
          font-family:monospace;
        "
      >
        00:00
      </div>

      <div
        id="activeStudentName"
        class="font-weight-bold text-primary text-uppercase"
        style="font-size:1.2rem;"
      >
        --
      </div>

    </div>


    <div
      class="text-left mx-auto my-3 text-secondary"
      style="max-width:85%;"
    >

      <p class="mb-1">
        <strong>DESTINATION:</strong>
        <span id="activeDest">--</span>
      </p>

    </div>


    <button
      id="endPassBtn"
      class="btn-main"
      style="
        background-color:#dc2626;
        width:85%;
      "
    >
      CHECK IN
    </button>

  </div>


  <!-- IMPORTANT:
       No debug HTML is inside the script.
  -->

  <script>
    
  </script>
</body>
</html>
