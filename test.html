<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GATEWAY - Hall Pass</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <style>
    /* Styling to keep disabled inputs cleanly readable as flat text instead of vanished fields */
    .form-control:disabled, .select2-container--disabled .select2-selection--single {
      background-color: #f1f3f5 !important;
      border: 1px solid #ced4da !important;
      color: #212529 !important;
      opacity: 0.85;
      cursor: default;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f7f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15px;
      margin: 0;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      margin-bottom: 15px;
      transition: border 0.3s ease, background-color 0.3s ease;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 8px;
    }
    .logo-container img {
      max-width: 140px;
      height: auto;
    }
    h2 {
      color: #1c4566;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
      font-size: 1.35rem;
    }
    #video, #teacherVideo {
      width: 100%;
      border-radius: 12px;
      background: #2c3e50;
      margin-bottom: 12px;
      display: none;
      transform: scaleX(-1);
    }
    #messageBanner {
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: 500;
      text-align: center;
      display: none;
      font-size: 0.9rem;
    }
    .msg-error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }
    .msg-success {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
      font-size: 1rem;
      padding: 10px;
    }
    .msg-info {
      background-color: #e3f2fd;
      color: #1565c0;
      border: 1px solid #90caf9;
      font-size: 1rem;
      padding: 10px;
    }
    .student-info {
      background: #e8f0fe;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: bold;
      color: #1967d2;
      text-align: center;
      font-size: 0.95rem;
    }
    .btn-main {
      background-color: #1a4567;
      color: white;
      padding: 6px 16px;
      border-radius: 8px;
      font-weight: bold;
      width: 60%;
      display: block;
      margin: 8px auto 0 auto;
      border: none;
      transition: 0.3s;
      font-size: 0.95rem;
    }
    .btn-main:hover {
      background-color: #afd14c;
      color: #000000;
    }
    .btn-main:disabled {
      background-color: #cccccc !important;
      color: #666666 !important;
      cursor: not-allowed;
    }
    .btn-staff {
      background-color: #5a6b7c;
      color: white;
      padding: 6px 16px;
      border-radius: 8px;
      font-weight: bold;
      width: 60%;
      display: block;
      margin: 8px auto 0 auto;
      border: none;
      transition: 0.3s;
      font-size: 0.95rem;
    }
    .btn-staff:hover {
      background-color: #afd14c !important;
      color: #000000 !important;
      text-decoration: none;
    }
    .btn-staff:disabled {
      background-color: #cccccc !important;
      color: #666666 !important;
      cursor: not-allowed;
    }
    .hidden {
      display: none !important;
    }
    label {
      font-weight: 600;
      color: #555;
      margin-top: 6px;
      margin-bottom: 4px;
      display: block;
      font-size: 0.9rem;
    }
    .form-control {
      border-radius: 8px;
      margin-bottom: 10px;
      height: 38px;
      font-size: 0.9rem;
    }
    .form-check {
      margin-bottom: 4px !important;
    }
    .staff-login-header {
      color: #c62828;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }
    .warning-flash {
      border: 3px solid #ef4444 !important;
      background-color: #fef2f2 !important;
    }
    .clean-pass {
      border: 3px solid #10b981 !important;
      background-color: #ecfdf5 !important;
    }
    .badge-eval {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-warn {
      background: #fee2e2;
      color: #991b1b;
    }
    .badge-ok {
      background: #d1fae5;
      color: #065f46;
    }
    .conflict-box {
      background-color: #fef2f2;
      border: 2px solid #ef4444;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
    }
    .select2-container {
      margin: 0 auto 10px auto !important;
      display: block !important;
    }
  </style>
</head>
<body>

  <div class="card" id="mainAppCard">
    <div class="logo-container" style="display: flex; justify-content: center; align-items: center; min-height: 70px; margin-bottom: 8px;">
      <img id="schoolLogo" src="" alt="School Logo" style="display: none; height: 70px; width: auto; object-fit: contain; max-width: 90%;">
    </div>
    <h2 id="appTitle">Loading Hall Pass...</h2>
    <div id="messageBanner"></div>

    <!-- 1. STAFF LOCATION INITIALIZATION GATE -->
    <div id="gatekeeperSection" class="text-center py-3 hidden">
      <p class="staff-login-header">Staff Login Required</p>
      <label for="staffLocationDrop" style="max-width: 85%; margin: 0 auto 6px auto; text-align: left;">Select Your Default Location:</label>
      <select id="staffLocationDrop" class="form-control mx-auto mb-3" style="width: 85%; max-width: 85%;"></select>
      <div id="staffLocationErrorMsg" class="text-danger small font-weight-bold my-2" style="display: none;">❌ Please select your location first.</div>
      <input type="password" id="gatekeeperPin" class="form-control text-center mx-auto" placeholder="Enter Access Code" style="max-width: 85%;">
      <div id="loginErrorMsg" class="text-danger small font-weight-bold my-2" style="display: none;">❌ Invalid Access Code. Try again.</div>
      <button id="verifyBtn" class="btn-main">VERIFY & ENTER</button>
    </div>

    <!-- 2. SCANNING INTERFACE (Student Flow - Starts Hidden) -->
    <div id="appProtectedContent" class="hidden">
      <div id="scannerSection" class="hidden">
        <video id="video" autoplay playsinline></video>
        <div id="studentInputGroup" class="d-flex align-items-center justify-content-center mx-auto" style="max-width: 60%; gap: 12px; margin-top: 8px;">
          <button id="startButton" class="btn-main m-0" style="flex: 1; width: auto; height: 38px; padding: 0;">SCAN Id</button>
          <button id="noIdButton" class="btn-main m-0" style="flex: 1; width: auto; height: 38px; padding: 0;">TYPE Id</button>
        </div>
        <div id="manualInputSection" class="hidden text-center mt-2">
          <label for="manualIdInput">Type Your Student ID Number:</label>
          <input type="text" id="manualIdInput" class="form-control text-center mx-auto" placeholder="e.g. 12345" style="font-size: 1.1rem; letter-spacing: 2px; max-width: 85%;">
          <button id="" class="btn-main">Look up ID</button>
        </div>
      </div>

      <!-- 3. INTERACTIVE STUDENT FLOW -->
      <div id="questionSection" class="hidden">
        <div id="studentDisplay" class="student-info"></div>
        <div id="studentSelectionSummary" class="text-left mx-auto mb-3 hidden" style="max-width: 85%; font-size: 0.95rem;">
          <ul class="m-0 pl-3" style="color: #495057; font-weight: 500; list-style-type: disc;">
            <li id="sumClassroom">Classroom: --</li>
            <li id="sumDestination">Destination: --</li>
          </ul>
        </div>
        <div id="studentFormFields">
          <label for="classroomDrop">Current Classroom</label>
          <select id="classroomDrop" class="form-control mx-auto" style="width: 85%; max-width: 85%;"></select>
          <label>Are you entering or leaving?</label>
          <div class="mb-3 text-left" style="max-width: 85%; margin: 0 auto; display: flex; flex-direction: row; gap: 25px;">
            <div class="form-check" style="margin: 0; padding-left: 20px;">
              <input class="form-check-input" type="radio" name="status" value="Entering" id="ent" style="margin-top: 5px;">
              <label class="form-check-label" for="ent" style="display:inline; margin:0; font-weight:normal; font-size: 0.95rem;">Entering</label>
            </div>
            <div class="form-check" style="margin: 0; padding-left: 20px;">
              <input class="form-check-input" type="radio" name="status" value="Leaving" id="lv" style="margin-top: 5px;">
              <label class="form-check-label" for="lv" style="display:inline; margin:0; font-weight:normal; font-size: 0.95rem;">Leaving</label>
            </div>
          </div>
          <div id="destinationSection" class="hidden">
            <label for="locationDrop">Where are you going?</label>
            <select id="locationDrop" class="form-control mx-auto" style="width: 85%; max-width: 85%;"></select>
          </div>
          <div id="submitActionArea" class="mt-2">
            <button id="submitBtn" class="btn-main" style="background-color: #34a853;">SUBMIT FOR APPROVAL</button>
          </div>
        </div>
      </div>

      <!-- 4. SUPERVISOR DELEGATION GATE (Appears below student values) -->
      <div id="supervisorGateSection" class="hidden text-center p-2 mt-3" style="border-top: 3px solid #1a4567; padding-top: 20px !important;">
        <h3 class="text-uppercase font-weight-bold mb-3" style="color: #1a4567; font-size: 0.95rem; letter-spacing: 1.5px;"> — Staff Approval — </h3>
        
        <div id="conflictContainer" class="conflict-box hidden text-left mx-auto mb-3" style="max-width: 85%;">
          <div id="evaluationBadgeArea"></div>
          <div id="evalMessageContainer" style="font-size: 0.85rem;">
            <ul id="evalMessageList" class="pl-3 mb-0 text-danger font-weight-bold" style="line-height: 1.4;"></ul>
          </div>
        </div>

        <div class="mb-3 mx-auto" style="max-width: 85%; display: flex; flex-direction: row; align-items: center; gap: 20px;">
          <label style="margin: 0; font-weight: 600; color: #555; font-size: 0.95rem;">Decision:</label>
          <div class="form-check" style="margin: 0; padding-left: 20px; display: inline-flex; align-items: center;">
            <input class="form-check-input" type="radio" name="staffDecision" value="Approved" id="decApprove" style="margin-top: 0;">
            <label class="form-check-label" for="decApprove" style="margin-left: 5px; font-weight: normal; font-size: 0.95rem;">Approved</label>
          </div>
          <div class="form-check" style="margin: 0; padding-left: 20px; display: inline-flex; align-items: center;">
            <input class="form-check-input" type="radio" name="staffDecision" value="Denied" id="decDeny" style="margin-top: 0;">
            <label class="form-check-label" for="decDeny" style="margin-left: 5px; font-weight: normal; font-size: 0.95rem;">Denied</label>
          </div>
        </div>

        <div class="form-group text-center mx-auto mb-2" style="max-width: 100%;">
          <video id="teacherVideo" autoplay playsinline class="rounded mb-2" style="width: 100%; display: none; transform: scaleX(-1); max-height: 220px; object-fit: cover;"></video>
          <div id="teacherInputGroup" class="d-flex align-items-center justify-content-center flex-row my-2 mx-auto" style="gap: 12px; max-width: 60%;">
            <button type="button" id="startTeacherScannerBtn" class="btn-staff m-0" style="width: auto; flex: 1; height: 38px; padding: 0;"> SCAN Id </button>
            <button type="button" id="noStaffIdLink" class="btn-staff m-0" style="width: auto; flex: 1; height: 38px; padding: 0;"> TYPE Id </button>
          </div>
          <div id="manualStaffPinContainer" class="mt-3" style="display: none;">
            <label for="staffPinVerify" class="font-weight-bold small text-uppercase text-muted text-center mb-1">Enter Staff ID / PIN Code:</label>
            <input type="password" id="staffPinVerify" class="form-control text-center font-weight-bold mx-auto" style="letter-spacing: 0.2em; font-size: 1.1rem; max-width: 60%;">
          </div>
        </div>

        <div id="staffErrorMsg" class="text-danger small font-weight-bold my-2" style="display: none; max-width: 85%; margin: 0 auto;">❌ Invalid Staff ID</div>
        <button id="gateSubmitBtn" class="btn btn-success font-weight-bold px-4 py-2 mt-3 shadow-sm hidden" style="border-radius: 8px; font-size: 0.9rem; min-width: 120px;">Submit</button>
      </div>
      <button id="cancelBtn" onclick="resetAppForm()" class="btn btn-link btn-sm btn-block mt-1 text-muted" style="font-size: 0.85rem;">Cancel / Start Over</button>
    </div>
  </div>
  <div class="card hidden text-center" id="activePassCard" style="border: 3px solid #10b981; background-color: #ffffff;">
    <div class="logo-container my-2">
      <img id="activeSchoolLogo" src="" alt="School Logo" style="height: 60px; max-width: 90%; object-fit: contain;">
    </div>
    <h2 id="activePassTitle" class="text-success font-weight-bold mb-1" style="font-size: 1.35rem;">✨ ACTIVE HALL PASS ✨</h2>
    <hr id="activePassDivider" class="my-2" style="border-top: 2px dashed #10b981;">
    
    <!-- Timer container box with dynamic styling -->
    <div id="timerContainerBox" class="p-3 my-2 rounded shadow-sm mx-auto" style="max-width: 90%; border: 3px solid #10b981; background-color: #f0fdf4;">
      <div id="timerSubtitle" class="text-muted small text-uppercase font-weight-bold tracking-wider" style="font-size: 0.75rem;">Time Out of Room</div>
      <div id="liveTimerDisplay" class="font-weight-bold text-dark my-1" style="font-size: 3rem; font-family: monospace; letter-spacing: 1px;">00:00</div>
      <div id="activeStudentName" class="font-weight-bold text-primary text-uppercase tracking-wide" style="font-size: 1.2rem;">--</div>
    </div>

    <div class="text-left mx-auto my-3 text-secondary" style="max-width: 85%; font-size: 0.95rem; font-weight: 500; line-height: 1.6;">
      <p class="mb-1"><strong>DESTINATION: </strong> <span id="activeDest">--</span></p>
    </div>

    <button id="endPassBtn" class="btn-main mt-2" style="background-color: #dc2626; width: 85%;">CHECK IN</button>
  </div>

  <script>
    let REQUIRE_STAFF_LOGIN = false;
    const urlParams = new URLSearchParams(window.location.search);
    const SCRIPT_URL = urlParams.get('scriptUrl');
    const SCHOOL_CONFIG = { masterSpreadsheetId: "1EIJev2djlZRXmRREpGV0mb_z6zNyMKMsyw7RfsGmRNo" };
    const MASTER_PASSWORD = "mbaea";
    let SECRETHASH = "";
    const LOCK_TIMEOUT_MS = 10 * 60 * 60 * 1000;
    let currentStudent = null;
    let masterClassrooms = [];
    let masterLocations = [];
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let teacherScannerActive = false;
    let passTimerInterval = null;
let passStartTime = null;

    function logToConsole(message, isError = false) {
      const timestamp = new Date().toLocaleTimeString();
      const formattedMessage = `[${timestamp}] ${message}`;
      if (isError) {
        console.error(formattedMessage);
      } else {
        console.log(formattedMessage);
      }
    }

    async function hashString(str) {
      const utf8 = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

window.addEventListener('DOMContentLoaded', async () => {
  sessionStorage.removeItem('hallPassLoginTime');
  sessionStorage.removeItem('staffDefaultLocation');
  SECRETHASH = await hashString(MASTER_PASSWORD.trim());
  
  if (SCRIPT_URL) {
    // 1. Initialize app configuration first (fetches logo & sets up UI)
    await initializeApp();

    // 🔄 2. Check if an active pass was running before the page refreshed
    const savedStartTime = localStorage.getItem('activePassStart');
    if (savedStartTime) {
      passStartTime = parseInt(savedStartTime);
      
      // Restore text fields
      document.getElementById('activeStudentName').innerText = localStorage.getItem('activePassStudent') || "Student";
      document.getElementById('activeDest').innerText = localStorage.getItem('activePassDest') || "Destination";
      
      // 🖼️ FIX LOGO: Helper function to apply logo reliably
      const activeLogo = document.getElementById('activeSchoolLogo');
      const mainLogo = document.getElementById('schoolLogo');

      const applyLogoSrc = () => {
        if (mainLogo && mainLogo.src && !mainLogo.src.endsWith('test.html') && mainLogo.src !== window.location.href) {
          activeLogo.src = mainLogo.src;
          activeLogo.style.display = 'inline-block';
        } else if (SCHOOL_CONFIG && SCHOOL_CONFIG.schoolLogoUrl) {
          activeLogo.src = SCHOOL_CONFIG.schoolLogoUrl;
          activeLogo.style.display = 'inline-block';
        }
      };

      // Try setting logo immediately, but also listen for when mainLogo finishes loading async
      applyLogoSrc();
      if (mainLogo) {
        mainLogo.onload = applyLogoSrc;
      }
      setTimeout(applyLogoSrc, 800); // Secondary fallback after sheet fetch completes

      // 🙈 FIX UI OVERLAY: Force ALL main card components to stay permanently hidden during active pass
      const hideMainCard = () => {
        document.getElementById('mainAppCard').classList.add('hidden');
        document.getElementById('appProtectedContent').classList.add('hidden');
        document.getElementById('scannerSection').classList.add('hidden');
        document.getElementById('questionSection').classList.add('hidden');
        document.getElementById('activePassCard').classList.remove('hidden');
      };

      hideMainCard();
      // Call again after a short delay to override any late-firing resetAppForm() calls from initializeApp()
      setTimeout(hideMainCard, 300);

      // 5. Start ticking timer interval
      if (passTimerInterval) clearInterval(passTimerInterval);
      
      passTimerInterval = setInterval(() => {
        const elapsedMs = Date.now() - passStartTime;
        const totalSeconds = Math.floor(elapsedMs / 1000);
        const totalMinutes = Math.floor(totalSeconds / 60);
        
        const minutes = totalMinutes.toString().padStart(2, '0');
        const seconds = (totalSeconds % 60).toString().padStart(2, '0');
        
        document.getElementById('liveTimerDisplay').innerText = `${minutes}:${seconds}`;

        const outerCard = document.getElementById('activePassCard');
        const innerBox = document.getElementById('timerContainerBox');
        const titleText = document.getElementById('activePassTitle');
        const dividerLine = document.getElementById('activePassDivider');

        if (totalMinutes < 5) {
          outerCard.style.borderColor = "#10b981";
          innerBox.style.borderColor = "#10b981";
          innerBox.style.backgroundColor = "#f0fdf4";
          if (titleText) titleText.style.color = "#10b981";
          if (dividerLine) dividerLine.style.borderColor = "#10b981";
        } else {
          outerCard.style.borderColor = "#ef4444";
          innerBox.style.borderColor = "#ef4444";
          innerBox.style.backgroundColor = "#fef2f2";
          if (titleText) titleText.style.color = "#ef4444";
          if (dividerLine) dividerLine.style.borderColor = "#ef4444";
        }
      }, 1000);
    }
  } else {
    logToConsole("⚠️ Connection Error: Missing '?scriptUrl=' parameter in browser path.", true);
    alert("Configuration Error: Missing 'scriptUrl' parameter in your browser link!");
  }
});

    document.getElementById('verifyBtn').onclick = async () => {
      const chosenStaffLoc = document.getElementById('staffLocationDrop').value;
      const staffLocError = document.getElementById('staffLocationErrorMsg');
      const errorDiv = document.getElementById('loginErrorMsg');
      
      if (!chosenStaffLoc) {
        staffLocError.style.display = 'block';
        return;
      }
      staffLocError.style.display = 'none';

      const input = document.getElementById('gatekeeperPin').value.trim();
      if (!input) {
        errorDiv.textContent = "❌ Access code cannot be blank.";
        errorDiv.style.display = 'block';
        return;
      }
      
      const inputHash = await hashString(input);
      const expectedHash = await hashString(MASTER_PASSWORD.trim());
      if (inputHash === expectedHash) {
        errorDiv.style.display = 'none';
        sessionStorage.setItem('hallPassLoginTime', Date.now().toString());
        sessionStorage.setItem('staffDefaultLocation', chosenStaffLoc);
        logToConsole(`Staff Session Authenticated at Room: ${chosenStaffLoc}`);
        showAppDirectly();
      } else {
        errorDiv.textContent = "❌ Invalid Access Code. Try again.";
        errorDiv.style.display = 'block';
        document.getElementById('gatekeeperPin').value = '';
        document.getElementById('gatekeeperPin').focus();
      }
    };

    document.getElementById('gatekeeperPin').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('verifyBtn').click();
    });

    function showAppDirectly() {
      document.getElementById('gatekeeperSection').classList.add('hidden');
      document.getElementById('appProtectedContent').classList.remove('hidden');
      resetAppForm();
      document.getElementById('scannerSection').classList.remove('hidden');
    }

    function isSessionExpired() {
      if (!REQUIRE_STAFF_LOGIN) return false;
      const loginTime = sessionStorage.getItem('hallPassLoginTime');
      if (!loginTime) return false;
      if (Date.now() - parseInt(loginTime) >= LOCK_TIMEOUT_MS) {
        sessionStorage.removeItem('hallPassLoginTime');
        sessionStorage.removeItem('staffDefaultLocation');
        return true;
      }
      return false;
    }

    function showMessage(text, type) {
      const banner = document.getElementById('messageBanner');
      banner.innerText = text;
      banner.className = '';
      banner.classList.add(type === 'error' ? 'msg-error' : type === 'success' ? 'msg-success' : 'msg-info');
      banner.style.display = 'block';
    }

    function updateDestinationOptions(selectedClassroom) {
      const locDrop = document.getElementById('locationDrop');
      locDrop.innerHTML = "";
      locDrop.add(new Option("", "", true, true));
      masterLocations.forEach(l => {
        if (l !== selectedClassroom) {
          locDrop.add(new Option(l, l));
        }
      });
      $(locDrop).select2({ width: '85%', placeholder: 'Select a destination...' }).on('select2:open', function() {
          document.querySelector('.select2-search__field').placeholder = "Search to narrow results...";
        });    
    }

function resetAppForm() {
    currentStudent = null;
    teacherScannerActive = false;
    
    // 1. Safe scanner reset
    try { codeReader.reset(); } catch(e) {}
    
    // 2. Safe timer cleanup
    if (typeof passTimerInterval !== 'undefined' && passTimerInterval) {
      clearInterval(passTimerInterval);
      passTimerInterval = null;
    }

    // Safe DOM Display Helper
    const setDisplay = (id, val) => {
      const el = document.getElementById(id);
      if (el) el.style.display = val;
    };

    // Safe DOM Class Helper
    const setHidden = (id, shouldHide) => {
      const el = document.getElementById(id);
      if (el) {
        if (shouldHide) el.classList.add('hidden');
        else el.classList.remove('hidden');
      }
    };

    const mainCard = document.getElementById('mainAppCard');
    if (mainCard) mainCard.className = 'card';

    setDisplay('messageBanner', 'none');
    setDisplay('staffErrorBanner', 'none');
    setDisplay('video', 'none');
    setDisplay('teacherVideo', 'none');
    setDisplay('timerContainerBox', 'none');

  setHidden('studentSelectionSummary', true);  // Hide compact summary when resetting

        .then(r => r.json())
        .then(data => {

            document.getElementById('appTitle').innerText = `${data.schoolName} Hall Pass`;
            logToConsole("Database Connected");
          }
          if (data && data.requireStaffLogin !== undefined) {
            REQUIRE_STAFF_LOGIN = data.requireStaffLogin;

    function checkStudent(id) {
      logToConsole(`Looking up Student ID: ${id}`);
      const studentUrl = `${SCRIPT_URL}?action=findStudent&data=${encodeURIComponent(JSON.stringify(id))}`;
      fetch(studentUrl)
        .then(r => r.json())
        .then(student => {

            logToConsole(`❌ Student ID "${id}" not found.`, true);
            showMessage(`No student record with ID "${id}" found.`, "error");
            document.getElementById('video').style.display = 'none';
            document.getElementById('studentInputGroup').classList.remove('hidden');
            document.getElementById('manualInputSection').classList.add('hidden');
            document.getElementById('manualSubmitBtn').disabled = false;
            document.getElementById('manualSubmitBtn').innerText = "Look up ID";
            return;
          }
          document.getElementById('messageBanner').style.display = 'none';
          currentStudent = student;
          document.getElementById('studentDisplay').innerText = `${student.name} (Grade ${student.grade})`;
          document.getElementById('scannerSection').classList.add('hidden');
          document.getElementById('manualInputSection').classList.add('hidden');
          document.getElementById('questionSection').classList.remove('hidden');

    function handlePassSubmission() {
    if (isSessionExpired()) {
      alert("Staff session expired. Please log in again.");
      location.reload();
      return;
    }
    
    const status = document.querySelector('input[name="status"]:checked')?.value;
    const classroom = document.getElementById('classroomDrop').value;
    const destination = document.getElementById('locationDrop').value;
    
    if (!classroom || classroom === "") { 
      showMessage("⚠️Please select your current classroom location."); 
      return; 
    }
    if (!status) { 
      showMessage("⚠️"Select Entering or Leaving."); 
      return; 
    }
    if (status === 'Leaving' && !destination) { 
      showMessage("⚠️"Select a destination."); 
      return; 
    }

    // Validation rule: current classroom and destination cannot match ONLY when leaving
    if (status === 'Leaving' && classroom === destination) {
      showMessage("⚠️ Your current classroom and destination cannot be the same when leaving.");
      return;
    }

    // A. INSTANT BYPASS FOR "ENTERING" / CHECK-IN
    if (status === "Entering") {
      logToConsole("Routing 'Entering' check-in directly to Logs...");
      document.getElementById('submitBtn').classList.add('hidden');
      
      const payload = { 
        ...currentStudent, 
        classroom: classroom, 
        status: "Entering", 
        destination: "Entering Classroom",
        decision: "",
        teacher: ""
      };
      executeSavePass(payload);
      return;
    }

    // B. EVALUATION GATE FOR "LEAVING"
    logToConsole("Routing 'Leaving' request through evaluation gateway...");
    
    // Disable inputs only during active supervisor gate processing
    document.getElementById('classroomDrop').disabled = true;
    $(document.getElementById('classroomDrop')).prop('disabled', true);
    
    document.querySelectorAll('input[name="status"]').forEach(input => input.disabled = true);
    
    const locDrop = document.getElementById('locationDrop');
    locDrop.disabled = true;
    $(locDrop).prop('disabled', true).trigger('change');

    document.getElementById('submitBtn').classList.add('hidden');
    showMessage("Evaluating student metrics...", "info");
    
    const evalUrl = `${SCRIPT_URL}?action=evaluateStudent&id=${currentStudent.id}&masterSpreadsheetId=${SCHOOL_CONFIG.masterSpreadsheetId}`;

    fetch(evalUrl)
      .then(async response => {
        const responseText = await response.text();
        try {
          const evalData = JSON.parse(responseText);
          document.getElementById('messageBanner').style.display = 'none';
          if (evalData.status === "Evaluated") {
            launchSupervisorGate(classroom, destination, evalData);
          } else {
            alert("Evaluation Error: ID validation issue.");
            resetAppForm();
          }
        } catch (jsonError) {
          throw new Error("Invalid JSON returned from server.");
        }
      })
      .catch(err => {
        logToConsole(`❌ Network request failed to reach the evaluation engine. Detail: ${err.message}`, true);
        resetAppForm();
      });
  }

    function launchSupervisorGate(classroom, destination, evalData) {
      const gatePanel = document.getElementById("supervisorGateSection");
      const badgeArea = document.getElementById("evaluationBadgeArea");
      const evalList = document.getElementById("evalMessageList");
      const conflictContainer = document.getElementById("conflictContainer");
      const rawMessage = evalData.evaluationMessage || "";
      const cleanNoConflicts = rawMessage.toLowerCase().includes("no conflicts") || rawMessage.toLowerCase().trim() === "";
      const hasConflicts = !cleanNoConflicts;
      
      gatePanel.classList.remove('hidden');
      if (hasConflicts) {
        document.getElementById('decDeny').checked = true;
        conflictContainer.classList.remove('hidden');
        badgeArea.innerHTML = `<span class="badge-eval badge-warn">Conflicts Detected</span>`;
        evalList.innerHTML = "";
        const lines = rawMessage.split('\n').map(line => line.trim()).filter(line => line.length > 0);
        lines.forEach(line => {
          const li = document.createElement('li');
          li.innerText = line;
          evalList.appendChild(li);
        });
        logToConsole(`⚠️ Student Gated with Conflicts:\n${rawMessage}`, true);
      } else {
        document.getElementById('decApprove').checked = true;
        conflictContainer.classList.add('hidden');
        logToConsole("Student matches clean limits check. Ready for fast approval.");
      }
      
      const manualContainer = document.getElementById("manualStaffPinContainer");
      const noIdLink = document.getElementById("noStaffIdLink");
      const teacherScannerBtn = document.getElementById("startTeacherScannerBtn");
      const staffInput = document.getElementById("staffPinVerify");
      
      document.getElementById('staffErrorMsg').style.display = 'none';
      manualContainer.style.display = "none";
      noIdLink.style.display = "block";
      staffInput.value = "";
      teacherScannerBtn.innerText = "SCAN Id";
      teacherScannerBtn.style.backgroundColor = "";
      
      noIdLink.onclick = () => {
        manualContainer.style.display = "block";
        noIdLink.style.display = "none";
        document.getElementById("gateSubmitBtn").classList.remove("hidden");
        staffInput.focus();
      };
      
      try {
        codeReader.reset();
      } catch(e) {}
      
      teacherScannerActive = false;
      teacherScannerBtn.onclick = () => {
        const teacherVideo = document.getElementById('teacherVideo');
        if (!teacherScannerActive) {
          teacherVideo.style.display = 'block';
          teacherScannerActive = true;
          teacherScannerBtn.innerText = "STOP SCAN";
          teacherScannerBtn.style.backgroundColor = "#dc3545";
          manualContainer.style.display = "none";
          noIdLink.style.display = "none";
          document.getElementById("gateSubmitBtn").classList.add("hidden");
          codeReader.decodeFromVideoDevice(null, 'teacherVideo', (result, err) => {
            if (result) {
              codeReader.reset();
              teacherVideo.style.display = 'none';
              teacherScannerBtn.innerText = "SCAN Id";
              teacherScannerBtn.style.backgroundColor = "";
              teacherScannerActive = false;
              staffInput.value = result.text.trim();
              logToConsole(`Scanned Staff ID Code: ${result.text.trim()}`);
              noIdLink.style.display = "block";
              document.getElementById("gateSubmitBtn").click();
            }
          });
        } else {
          codeReader.reset();
          teacherVideo.style.display = 'none';
          teacherScannerBtn.innerText = "SCAN Id";
          teacherScannerBtn.style.backgroundColor = "";
          teacherScannerActive = false;
          noIdLink.style.display = "block";
        }
      };

      document.getElementById("gateSubmitBtn").onclick = () => {
        const staffPin = staffInput.value.trim();
        const decision = document.querySelector('input[name="staffDecision"]:checked')?.value || "Approved";
        
        if (!staffPin) {
          const staffError = document.getElementById('staffErrorMsg');
          staffError.style.display = 'block';
          staffError.innerText = "❌ Please enter or scan a Staff ID to submit verification.";
          logToConsole("❌ Verification attempt blocked: No Staff ID provided.", true);
          return;
        }
        document.getElementById('staffErrorMsg').style.display = 'none';
        logToConsole("Verifying Staff ID...");
        
        const classroomVal = document.getElementById('classroomDrop').value;
        const statusVal = document.querySelector('input[name="status"]:checked')?.value || "Leaving";
        const verifyUrl = `${SCRIPT_URL}?action=findStaff&staffId=${encodeURIComponent(staffPin)}`; 
        fetch(verifyUrl)
          .then(res => {
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            return res.json();
          })
          .then(staffResult => {
        if (staffResult.status === "Found") {
            logToConsole(`✓ Staff verified: ${staffResult.staffName}`);
            
            // 1. HIDE THE STAFF SCAN / TYPE BUTTONS
            document.getElementById("teacherInputGroup").style.setProperty("display", "none", "important");
            document.getElementById("teacherInputGroup").classList.add("hidden");
            
            // 2. Hide other validation containers
            document.getElementById("manualStaffPinContainer").style.display = "none";
            document.getElementById("gateSubmitBtn").classList.add("hidden");
            document.getElementById("staffErrorMsg").style.display = "none";
            
            const destinationVal = document.getElementById('locationDrop').value;
            const payload = { 
                ...currentStudent, 
                classroom: classroomVal, 
                status: statusVal, 
                destination: destinationVal, 
                decision: decision, 
                teacher: staffResult.staffName, 
                conflicts: rawMessage 
            };
            
            try { codeReader.reset(); } catch(e) {}
            
            showMessage("Saving pass record to database...", "info");
            executeSavePass(payload);
        } else {
              logToConsole("❌ Staff Verification Failed: Invalid ID Code.", true);
              document.getElementById('staffErrorMsg').style.display = 'block';
              document.getElementById('staffErrorMsg').innerText = "❌ Invalid Staff ID. Try scanning or entering again.";
            }
          })

            document.getElementById('staffErrorMsg').style.display = 'block';
            document.getElementById('staffErrorMsg').innerText = `❌ Server error occurred: ${err.message}`;
          });

    function executeSavePass(payload) {
      logToConsole("Executing final database submission write...");
      logToConsole(`[Debug] Sending Payload: ${JSON.stringify(payload)}`);
      logToConsole(`[Debug] Target Spreadsheet ID: ${SCHOOL_CONFIG.masterSpreadsheetId}`);
      logToConsole(`[Debug] Target Script URL: ${SCRIPT_URL}`);
      const submitUrl = `${SCRIPT_URL}?action=submitLog&data=${encodeURIComponent(JSON.stringify(payload))}&masterSpreadsheetId=${SCHOOL_CONFIG.masterSpreadsheetId}`;
      fetch(submitUrl)
        .then(r => {
          logToConsole(`[Debug] HTTP Response Status: ${r.status} (${r.statusText})`);
          return r.json();
        })
        .then(res => {
          logToConsole(`[Debug] Server Response JSON: ${JSON.stringify(res)}`);
          if (res.success) {
            const rowInfo = res.row ? ` at row ${res.row}` : "";
            const sheetInfo = res.sheet ? ` in sheet "${res.sheet}"` : "";
            logToConsole(`🎉 Pass successfully logged${rowInfo}${sheetInfo}!`);
            
            // 1. Read the staff decision radio button state
            const decisionElement = document.querySelector('input[name="staffDecision"]:checked');
            const decision = decisionElement ? decisionElement.value : "Approved";

            // 2. Check device mode logic
            if (decision === "Denied") {
              showMessage("Pass request denied. Form reset.", "info");
              setTimeout(() => { resetAppForm(); }, 2000);
            } else if (REQUIRE_STAFF_LOGIN === true) {
              // 🏢 Staff Device: Always reset immediately
              showMessage("Pass approved! Form resetting for next user...", "success");
              setTimeout(() => { resetAppForm(); }, 2000);
            } else {
              // 🎒 Student Device (staffLogin is false): Load the active timer!
              showMessage("Pass successfully recorded!", "success");
              setTimeout(() => { startActivePassTimer(); }, 1500);
            }
          } else {
            logToConsole(`❌ Database rejected writing values. Server Message: ${res.message || "None provided"}`, true);
            alert(`Error saving log data: ${res.message || "Unknown error"}`);
            resetAppForm();
          }
        })
        .catch(err => {
          logToConsole(`❌ Submission request failed network connectivity check. Detail: ${err.message}`, true);
          alert("Submission Network Error.");
          resetAppForm();
        });
    }
function startActivePassTimer() {
  const studentName = currentStudent ? currentStudent.name : "Student";
  const destRoom = document.getElementById('locationDrop').value || "General Destination";

  const mainLogo = document.getElementById('schoolLogo');
  const activeLogo = document.getElementById('activeSchoolLogo');
  if (mainLogo && activeLogo) {
    activeLogo.src = mainLogo.src;
    activeLogo.style.display = 'inline-block';
  }
  
  // 🌟 ONLY update the elements that actually exist in your HTML now:
  document.getElementById('activeStudentName').innerText = studentName;
  document.getElementById('activeDest').innerText = destRoom;

  document.getElementById('mainAppCard').classList.add('hidden');
  document.getElementById('activePassCard').classList.remove('hidden');

 passStartTime = Date.now();
  if (passTimerInterval) clearInterval(passTimerInterval);
  
  passTimerInterval = setInterval(() => {
    const elapsedMs = Date.now() - passStartTime;
    const totalSeconds = Math.floor(elapsedMs / 1000);
    const totalMinutes = Math.floor(totalSeconds / 60);
    
    const minutes = totalMinutes.toString().padStart(2, '0');
    const seconds = (totalSeconds % 60).toString().padStart(2, '0');
    
    document.getElementById('liveTimerDisplay').innerText = `${minutes}:${seconds}`;

    // 🎨 Dynamic Alert Color Changes
    const outerCard = document.getElementById('activePassCard');
    const innerBox = document.getElementById('timerContainerBox');
    const titleText = document.getElementById('activePassTitle');
    const dividerLine = document.getElementById('activePassDivider');

    if (totalMinutes < 5) {
      // 🟢 Less than 5 minutes: Green styles
      outerCard.style.borderColor = "#10b981";
      innerBox.style.borderColor = "#10b981";
      innerBox.style.backgroundColor = "#f0fdf4"; // Light Green
      if (titleText) titleText.style.color = "#10b981";
      if (dividerLine) dividerLine.style.borderColor = "#10b981";
    } else {
      // 🔴 5 minutes or greater: Red styles
      outerCard.style.borderColor = "#ef4444";
      innerBox.style.borderColor = "#ef4444";
      innerBox.style.backgroundColor = "#fef2f2"; // Light Red
      if (titleText) titleText.style.color = "#ef4444";
      if (dividerLine) dividerLine.style.borderColor = "#ef4444";
    }
  }, 1000);

  localStorage.setItem('activePassStudent', studentName);
localStorage.setItem('activePassDest', destRoom);
localStorage.setItem('activePassStart', passStartTime.toString());
}

document.getElementById('endPassBtn').onclick = () => {

  // 🧹 Clear the saved persistence states from browser storage
  localStorage.removeItem('activePassStudent');

  localStorage.removeItem('activePassStart');

  // 1. Swap container views cleanly

  document.getElementById('scannerSection').classList.add('hidden');
  document.getElementById('questionSection').classList.remove('hidden');
  document.getElementById('studentFormFields').classList.remove('hidden');
  document.getElementById('cancelBtn').style.display = 'block';

  // 3. Scrub out message banners, previous staff decisions, or validation rules
  document.getElementById('messageBanner').style.display = 'none'; // 🧼 Hide previous pass success banner
  document.getElementById('supervisorGateSection').classList.add('hidden');
  document.getElementById('conflictContainer').classList.add('hidden');
  document.getElementById('staffErrorMsg').style.display = 'none';
  
  document.querySelectorAll('input[name="staffDecision"]').forEach(radio => {
    radio.checked = false;
  });
  
  const staffInput = document.getElementById("staffPinVerify");
  if (staffInput) staffInput.value = "";
  
  const gateSubmitBtn = document.getElementById("gateSubmitBtn");
  if (gateSubmitBtn) gateSubmitBtn.classList.add("hidden");

  // 4. Ensure the student identifier window remains visible
  if (currentStudent) {
    document.getElementById('studentDisplay').innerText = `👤 Student: ${currentStudent.name} (${currentStudent.id})`;
  }

  // 5. Explicitly lock "Entering" mode and adjust view visibilities
  const enteringRadio = document.getElementById('ent');
  if (enteringRadio) {
    enteringRadio.checked = true;
    
    // Hide destination selector since the student is checking back in
    document.getElementById('destinationSection').classList.add('hidden');
  }

  // 🧹 6. Clear out the classroom dropdown so the student MUST pick a check-in location
  $('#classroomDrop').val('').trigger('change');

  // 7. Reset action button layout back to standard student submission style
  document.getElementById('submitActionArea').innerHTML = `<button id="submitBtn" class="btn-main" style="background-color: #34a853;">SUBMIT PASS</button>`;
  document.getElementById('submitBtn').classList.remove('hidden');
  document.getElementById('submitBtn').onclick = handlePassSubmission;
};
    
  </script>
</body>
</html>
